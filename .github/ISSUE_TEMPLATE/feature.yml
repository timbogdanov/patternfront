name: Feature request
description: Suggest something the editor should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you are stuck on, rather than the solution you have in mind.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
