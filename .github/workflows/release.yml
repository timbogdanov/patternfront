name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Refuse to cut a release from code that does not pass its own checks.
      - name: Verify before packaging
        shell: bash
        run: ./tools/verify-all.sh

      # macOS builds both arm64 and x64 slices; Windows builds x64 + arm64.
      # Unsigned: see README, "Install". To turn signing on, add CSC_LINK,
      # CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
      # APPLE_TEAM_ID as repository secrets and set hardenedRuntime: true in
      # electron-builder.yml. No other change is needed.
      - name: Build installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false


      # A bundle whose signature no longer matches its contents runs fine here,
      # but macOS reports it as "damaged" once it has been downloaded and
      # carries com.apple.quarantine — and there is no way for a user past that.
      # The quarantine flag is what makes it visible, so CI cannot reproduce the
      # symptom; assert the seal itself instead.
      - name: The macOS bundle is sealed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for app in dist/mac*/PatternFront.app; do
            found=1
            echo "verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          [ "$found" = 1 ] || { echo "::error::no packaged .app found to verify"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -exec cp {} out/ \;
          ls -la out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: out/*
          body: |
            ## Install

            **macOS** (Apple silicon) — open the `.dmg` and drag PatternFront
            to Applications, then open it *from there*. These builds are
            **unsigned**, so the first launch needs: right-click → **Open** →
            **Open**. Opening it from the mounted image instead runs it
            translocated from a random read-only path, and the copy left in
            Downloads is what Finder later numbers "PatternFront 2".

            **Windows** — run the `Setup` installer. SmartScreen will show
            "Windows protected your PC" → **More info** → **Run anyway**.

            Signing certificates cost money this project does not spend yet.
            If you would rather not trust an unsigned build, `npm run dist`
            builds it yourself from source in one command.
