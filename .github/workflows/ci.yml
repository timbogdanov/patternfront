name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the first run, not queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The suite runs on Windows too. It only ever ran on Linux before, which is
    # how three portability bugs reached a release build: Python defaulting to
    # cp1252 when reading UTF-8 sources, and a test that provokes a write
    # failure with chmod, which Windows does not honour on directories.
    name: Verification suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suites are pure stdlib on both sides — nothing to install. The
      # OpenFront cross-check has no checkout here and skips loudly; that is
      # reported, never silently treated as a pass.
      - name: Run every check
        shell: bash
        run: ./tools/verify-all.sh

      - name: Fixtures are in sync with the generator
        shell: bash
        run: |
          python3 tools/gen-codec-fixtures.py
          git diff --exit-code tests/fixtures/codec.json \
            || (echo "::error::tests/fixtures/codec.json is stale — run python3 tools/gen-codec-fixtures.py"; exit 1)

      - name: Stamps are in sync with the generator
        shell: bash
        # Writes into the workspace, not /tmp — that path does not exist for
        # Windows Python. PYTHONIOENCODING keeps the redirect utf-8 there too,
        # where stdout would otherwise default to cp1252.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 tools/gen-stamps.py --emit > stamps-generated.txt
          python3 - <<'PY'
          import re, sys
          gen = re.search(r"const STAMPS=\[\n(.*?)\n\];",
                          open("stamps-generated.txt", encoding="utf-8").read(), re.S)
          app = re.search(r"const STAMPS=\[\n(.*?)\n\];",
                          open("app/patternfront.html", encoding="utf-8").read(), re.S)
          if not gen or not app:
              sys.exit("could not find a STAMPS block")
          g = [l.strip() for l in gen.group(1).splitlines() if l.strip()]
          a = [l.strip() for l in app.group(1).splitlines() if l.strip()]
          if g != a:
              print(f"::error::the editor's STAMPS table does not match the generator "
                    f"({len(a)} in the app, {len(g)} generated)")
              for line in [x for x in g if x not in a][:5]:
                  print("  generated but missing:", line)
              for line in [x for x in a if x not in g][:5]:
                  print("  in the app but not generated:", line)
              sys.exit(1)
          print(f"{len(a)} stamps match")
          PY

  smoke:
    name: Desktop app launches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Electron needs a display and the usual Chromium shared libraries.
      # xvfb-run gives it a virtual one; without this the app cannot start at
      # all and "it built" would be the only thing CI ever proved.
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 \
            libgbm1 libxss1 libxtst6

      # Chromium's SUID sandbox helper has to be owned by root with the setuid
      # bit; npm cannot install it that way. The alternative is --no-sandbox,
      # which would mean the smoke test exercises a different configuration
      # from the one users actually run — so fix the permissions instead.
      #
      # The binary is fetched lazily rather than during `npm ci`, so run the
      # package's own downloader first. Not `npx electron --version` — that
      # launches the binary, which trips the very sandbox error being fixed.
      - name: Let Chromium use its sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          ls -l node_modules/electron/dist/chrome-sandbox

      - name: Launch the app and assert the editor came up
        run: xvfb-run --auto-servernum npm run smoke

      # The suite that would have caught a broken build before it shipped: real
      # mouse input, the real save path, the real document round-trip.
      - name: Drive the app end to end
        run: xvfb-run --auto-servernum npm run e2e
        env:
          SCREENSHOT_DIR: /tmp/e2e-shots

      - name: Capture the window
        run: xvfb-run --auto-servernum npx electron . --shot /tmp/patternfront.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: |
            /tmp/patternfront.png
            /tmp/e2e-shots

  package:
    name: Package (${{ matrix.os }})
    # Packaging is slow, so it only runs once the cheap checks are green.
    needs: [verify, smoke]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Unsigned on purpose — see README. CSC_IDENTITY_AUTO_DISCOVERY=false
      # stops electron-builder picking up a stray keychain identity on macOS
      # runners and producing builds that are signed with something arbitrary.
      - name: Build installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""
          # electron-builder skips signing on pull-request builds, which exists
          # to keep a fork from getting at real signing certificates. This
          # project has none — `identity: "-"` is ad-hoc, no secret material of
          # any kind — so the guard protects nothing here and only produces an
          # unsealed bundle that the next step then rejects.
          #
          # If a Developer ID is ever added as a secret, remove this: the guard
          # becomes load-bearing again.
          CSC_FOR_PULL_REQUEST: true


      # A bundle whose signature no longer matches its contents runs fine here,
      # but macOS reports it as "damaged" once it has been downloaded and
      # carries com.apple.quarantine — and there is no way for a user past that.
      # The quarantine flag is what makes it visible, so CI cannot reproduce the
      # symptom; assert the seal itself instead.
      - name: The macOS bundle is sealed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for app in dist/mac*/PatternFront.app; do
            found=1
            echo "verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          [ "$found" = 1 ] || { echo "::error::no packaged .app found to verify"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
