appId: io.github.timbogdanov.patternfront
productName: PatternFront
copyright: Copyright © 2026 timbogdanov

directories:
  output: dist
  buildResources: build

# Only what the app actually runs. The docs, tools and tests stay in the repo
# but have no business inside a shipped binary.
files:
  - electron/**/*
  - app/**/*
  - package.json
  - LICENSE
  - "!**/.DS_Store"

# A .patternfront file is the JSON that serialiseDoc() produces. Registering it
# is what makes double-clicking one in Finder or Explorer open the editor.
fileAssociations:
  - ext: patternfront
    name: PatternFront Pattern
    description: PatternFront 1-bit pattern
    role: Editor
    rank: Owner
    icon: build/icon.png

mac:
  category: public.app-category.graphics-design
  icon: build/icon.png
  # One artifact, deliberately. Four macOS files (two DMGs, two zips) meant a
  # person downloading twice ended up with PatternFront, PatternFront 2 and
  # PatternFront 3 sitting in Finder, with no way to tell which was which.
  # Apple silicon only: an Intel build is a build nobody here can test.
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signed. Not a substitute for a Developer ID — Gatekeeper still
  # refuses the app on first launch — but it is the difference between a refusal
  # the user can clear and one they cannot.
  #
  # Electron's binaries arrive linker-signed. Packaging rewrites the bundle:
  # the executable is renamed, Info.plist is rebuilt, the icon and app.asar are
  # added. With signing switched off entirely, that leaves a signature whose
  # seal no longer matches its contents, and codesign says:
  #
  #     code has no resources but signature indicates they must be present
  #
  # An unquarantined build runs anyway, so this never showed up in local or CI
  # testing. A *downloaded* build carries com.apple.quarantine, Gatekeeper reads
  # the broken seal, and macOS reports "PatternFront is damaged and can't be
  # opened. You should eject the disk image." There is no right-click → Open
  # past that one; the app is simply dead on arrival.
  #
  # Ad-hoc signing re-seals the bundle so it is internally consistent. Gatekeeper
  # then gives the ordinary unidentified-developer refusal, which right-click →
  # Open does clear.
  identity: "-"

  # A real Developer ID ($99/yr) is what removes the warning altogether, and
  # also stops macOS running the app translocated from a random read-only path.
  # The hardened runtime and entitlements are wired up but inert until CSC_LINK
  # is set — see README, "Building". Turning it on is setting secrets, not
  # editing this file.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHighResolutionCapable: true
    LSApplicationCategoryType: public.app-category.graphics-design

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  icon: build/icon.png
  # Likewise one: the installer, x64. The arm64 and universal installers and the
  # portable build were three more things to choose between and none of them
  # answered a question the plain installer does not.
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

# electron-builder would otherwise try to reach out during CI runs.
publish: null
